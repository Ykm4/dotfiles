# ============================================================
# Google Cloud CLI Tasks
# ============================================================
#
# 認証まわりは ~/.config/mise/tasks/google/ のファイルタスク（google:auth / google:status）が担う。
# gcloud の実行は Claude Code の google-cloud-cli MCP（Cloud CLI リモート MCP）へ寄せ、ローカル gcloud はその補助に限る。
# こちらは Google Cloud CLI 自体の更新と状態表示に限る。
#
# 実体は Homebrew ではなく Google 公式の versioned archive から導入する。
# 導入は .chezmoiscripts/run_after_90-gcloud-install.sh、所在は .zshenv の GCLOUD_SDK_ROOT。
# Homebrew の cask を使わない理由は同スクリプトのコメントに書いてある。

[tasks."gcloud:upgrade"]
description = "Google Cloud CLI のコンポーネントを更新する（未導入ならスキップ）"
# Google 公式は「更新は gcloud components update」と案内している。SDK は自分で自分を更新するので、
# バージョン管理ツールの下に置かず、component manager に一本化する。
#
# 実体が無ければスキップする。導入は chezmoi の bootstrap スクリプトの責務である。
# ここで失敗させると mise が tools:update の DAG を打ち切り、掃除フェーズが走らないうえ、
# 並走中の mise:upgrade まで途中で kill される。
#
# 更新そのものの失敗は握り潰さない。他の更新タスクもネットワーク依存で同じ権限を持つのに
# gcloud だけ非対称にすると、恒久的に壊れた gcloud が無言で更新されなくなる。
# 更新失敗で掃除まで止めたくないときは mise run -c tools:update を使う（brew:cleanup に二重の門がある）。
#
# wait_for に brew:upgrade:run を置くのは、SDK が使う python@3.14 が Homebrew 管理だからである。
# Apple Silicon では SDK 同梱 Python の実体が無く、外部 Python が要る。
#
# CLOUDSDK_PYTHON はこのタスクの中だけで設定する。日常の実行では設定しない。
# 設定しないと、components が実際に更新されたあとに走る InstallPythonAndDependenciesOnMac が
# python_manager.py の _GcloudRequiredPythonToUse で None を返し、_MacInstallPython へ落ちる。
# そこは xcode-select --install と sudo installer を実行するため、mise タスク配下では
# sudo が SIGTTIN で無言停止しうる。判定は「設置パスに homebrew を含むか」なので、
# 公式 archive へ移した時点で Homebrew 経路は選ばれなくなった。
# 設定してあれば sudo を回避したうえで UpdatePythonDependencies が virtualenv を作り直す。
# 日常の実行で設定しないのは、ランチャーがこの変数の未設定時にだけ
# ~/.config/gcloud/virtenv を有効化し、native の crcmod・grpcio を使うためである。
# python@3.14 は Brewfile・run_after_90-gcloud-install.sh・ここの3か所に書かれる。上げるときは同時に直す。
wait_for = ["brew:upgrade:run"]
run = '''
gcloud_root="${GCLOUD_SDK_ROOT:-${XDG_DATA_HOME:-$HOME/.local/share}/google-cloud-sdk}"
gcloud_cli="$gcloud_root/bin/gcloud"
[ -x "$gcloud_cli" ] || gcloud_cli="$(command -v gcloud || true)"
if [ -z "$gcloud_cli" ] || [ ! -x "$gcloud_cli" ]; then
  echo "SKIP: gcloud CLI が見つからないため更新しない。" >&2
  echo "  導入は chezmoi apply（run_after_90-gcloud-install.sh）が行う。" >&2
  exit 0
fi
brew_python=/opt/homebrew/opt/python@3.14/bin/python3.14
if [ -x "${brew_python}" ]; then
  CLOUDSDK_PYTHON="${brew_python}" "$gcloud_cli" components update --quiet
else
  echo "WARN: ${brew_python} が無い。CLOUDSDK_PYTHON を固定せず更新する。" >&2
  echo "  components が更新されると sudo による Python 導入が走りうる。" >&2
  "$gcloud_cli" components update --quiet
fi
'''

[tasks."gcloud:check"]
description = "Google Cloud CLI の全コンポーネントの導入・更新状況を表示する（変更は加えない）"
# 所在の解決は gcloud:upgrade とそろえる。片方だけガードすると、更新はスキップされたのに
# 表示だけ落ちるという食い違いが出る。
run = '''
gcloud_root="${GCLOUD_SDK_ROOT:-${XDG_DATA_HOME:-$HOME/.local/share}/google-cloud-sdk}"
gcloud_cli="$gcloud_root/bin/gcloud"
[ -x "$gcloud_cli" ] || gcloud_cli="$(command -v gcloud || true)"
if [ -z "$gcloud_cli" ] || [ ! -x "$gcloud_cli" ]; then
  echo "SKIP: gcloud CLI が見つからない。chezmoi apply で導入する。" >&2
  exit 0
fi
"$gcloud_cli" components list
'''
