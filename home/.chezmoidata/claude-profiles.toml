# Claude Code のプロファイル定義。公開側の宣言点はここだけ。
# settings.json・claude:restore・claude:sync-links がすべてこのデータから生成される。
# claudeProfiles はプロファイル名をキーにした辞書。取引先のプロファイルは非公開側
# （client-dotfiles の .chezmoidata）が clientProfiles として同じ形で宣言し、
# テンプレートが両辞書を連結する。chezmoi のデータマージは配列を置換するため、
# 配列ではなく辞書で宣言する。取引先名を含むキーは公開側には書かない。
#
# <キー>        辞書のキーがプロファイル名
# configDir     $HOME からの相対パス
# explicitEnv   false のとき CLAUDE_CONFIG_DIR を設定せずに CLI を呼ぶ。
#               personal は既定値で動く。true にすると .claude.json が二重になる。
# excludeSkills 配布から除外するスキル名
# model / theme 設定するときだけ書く（settings.json の同名キーになる）
# marketplaces  kind は builtin か github。任意で autoUpdate（settings.json の同名キーになる）
# plugins       id と enabled
# mcp           name / transport / url または urlEnv / secretService（任意）/ oauth（任意）
#               secretService は秘密台帳（secrets-ledger.toml）のサービス名。指定すると
#               claude:restore が headersHelper（~/.config/secrets/claude/helpers/
#               <プロファイル>-<サービス>.sh）付きで登録し、ヘッダは接続の瞬間に
#               env ファイルから生成される。環境変数にもMCP設定にも値を置かない。
#               oauth は DCR 非対応のリモート MCP（Google のリモート MCP など）向けの事前登録
#               クライアント。clientIdEnv・clientSecretEnv（台帳の変数名）・callbackPort・scopes を書く。
#               claude:restore が登録時に env ファイルから読む。認証は claude:restore では完結せず、
#               対話ターミナルで claude mcp login <name> を1回実行する。
#               社内エンドポイントは urlEnv に台帳の変数名だけを書き、値は書かない
#               （claude:restore が env ファイルから読む）。
#
# 各プロファイルは excludeSkills・marketplaces・plugins・mcp を必ず持つ
# （テンプレートが直接 range するため。空にするときは = [] と書く）。
#
# claudeProfilesCommon は全プロファイル共通の宣言。settings.json 生成時に
# 各プロファイルの宣言の前へ連結される。plugins は id、marketplaces は name を
# キーに後勝ちのため、特定プロファイルだけ無効にしたいときは、そのプロファイルで
# 同じ id を enabled = false で再宣言する。共通化の対象は marketplaces と
# plugins のみ（mcp と excludeSkills は claude:restore / claude:sync-links が
# プロファイル単位で読むため対象外）。公開ファイルのため取引先名を含む宣言は
# ここに書かない。

[[claudeProfilesCommon.marketplaces]]
name = "claude-plugins-official"
kind = "builtin"
[[claudeProfilesCommon.marketplaces]]
name = "diagram-design"
kind = "github"
repo = "cathrynlavery/diagram-design"
[[claudeProfilesCommon.plugins]]
id = "superpowers@claude-plugins-official"
enabled = true
[[claudeProfilesCommon.plugins]]
id = "typescript-lsp@claude-plugins-official"
enabled = true
[[claudeProfilesCommon.plugins]]
id = "diagram-design@diagram-design"
enabled = true

[claudeProfiles.personal]
configDir = ".claude"
explicitEnv = false
excludeSkills = []
marketplaces = []
plugins = []
  [[claudeProfiles.personal.mcp]]
  name = "context7"
  transport = "http"
  url = "https://mcp.context7.com/mcp"
  secretService = "context7"
  [[claudeProfiles.personal.mcp]]
  name = "firecrawl"
  transport = "http"
  url = "https://mcp.firecrawl.dev/v2/mcp"
  secretService = "firecrawl"

[claudeProfiles.hucom-system]
configDir = ".config/claude/hucom-system"
explicitEnv = true
# 法人 Max プランなので Fable 5 を既定モデルにする。personal は Pro のため指定しない
# （Pro では Fable 5 がクレジット消費になるため、プランに応じた既定に任せる）。
model = "claude-fable-5[1m]"
theme = "dark"
excludeSkills = ["agents-sdk", "durable-objects", "wrangler", "mf-expense"]
  [[claudeProfiles.hucom-system.marketplaces]]
  name = "cloudflare"
  kind = "github"
  repo = "cloudflare/skills"
  autoUpdate = true
  [[claudeProfiles.hucom-system.marketplaces]]
  name = "hucom-system"
  kind = "github"
  repo = "hucom-system/claude-plugins"
  autoUpdate = true
  [[claudeProfiles.hucom-system.plugins]]
  id = "slack@claude-plugins-official"
  enabled = true
  [[claudeProfiles.hucom-system.plugins]]
  id = "cloudflare@cloudflare"
  enabled = true
  [[claudeProfiles.hucom-system.mcp]]
  name = "context7"
  transport = "http"
  url = "https://mcp.context7.com/mcp"
  secretService = "context7"
  [[claudeProfiles.hucom-system.mcp]]
  name = "firecrawl"
  transport = "http"
  url = "https://mcp.firecrawl.dev/v2/mcp"
  secretService = "firecrawl"
  [[claudeProfiles.hucom-system.mcp]]
  name = "google-dev-knowledge"
  transport = "http"
  url = "https://developerknowledge.googleapis.com/mcp"
  secretService = "google-dev-knowledge"
  [[claudeProfiles.hucom-system.mcp]]
  # Google Cloud の Cloud CLI リモート MCP（gcloud/bq をサーバ側で実行。Preview）。
  # Claude Code 専用の Desktop 種別 OAuth クライアント（1Password「Google OAuth Client claude-mcp hucom-system」）を使う。gws とは分ける。
  name = "google-cloud-cli"
  transport = "http"
  url = "https://cloudcli.googleapis.com/mcp"
  oauth = { clientIdEnv = "GOOGLE_MCP_OAUTH_CLIENT_ID_HUCOM_SYSTEM", clientSecretEnv = "GOOGLE_MCP_OAUTH_CLIENT_SECRET_HUCOM_SYSTEM", callbackPort = 8765, scopes = "https://www.googleapis.com/auth/cloud-platform" }

