# mermaid CLI（mmdc）のラッパー。
# aubeがpuppeteerのpostinstall（Chromiumダウンロード）をブロックするため、
# ~/.config/mermaid/puppeteer.json でシステムのChromeを指定して描画する。
# v12から --iconPacks はローカルにnpm installしたパッケージしか読まない。
# mise管理のmmdcからは見えないため、アイコンは --iconPacksNamesAndUrls でURLを指定する。
[tasks.mermaid]
description = "mermaid CLIで図を生成する。例: mise r mermaid -- --iconPacksNamesAndUrls 'logos#https://unpkg.com/@iconify-json/logos/icons.json' -i in.mmd -o out.svg"
dir = "{{cwd}}"
run = "mmdc -p {{env.HOME}}/.config/mermaid/puppeteer.json"
