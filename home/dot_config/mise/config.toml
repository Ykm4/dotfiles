# ============================================================
# 管理境界:
# - [tools]・mise 自身のタスク・tools:update（全体 DAG）は本ファイルに置く。
# - ドメイン別タスク（brew / textlint / skills / gh / db）は conf.d/<domain>.toml に置く。
# - chezmoi の run_onchange_after_20-mise-install.sh.tmpl は本ファイルの hash で
#   mise install を再実行するため、[tools] は必ず本ファイルに書く（conf.d に書くと新マシンで導入されない）。
# ============================================================
# jobs は既定（4）のまま。npm backend の aube 化で signal 9 は解消済み（再び下げない）。

# 秘密をシェル環境に常在させない設計（2026-08-30 API キー露出インシデント対応）。
# keywrap: 鍵が要る CLI のラッパー置き場。_.path はツールパスより前に来るため、
# mise 管理の実体（npm:firecrawl-cli 等）より先に解決される。
# FIRECRAWL_KEY_FILE / FIRECRAWL_KEY_VAR は「鍵ファイルのパスと変数名」だけで値ではない。
# 既定は personal で、各作業ツリーの mise.toml がプロファイルに応じて上書きする。
[env]
_.path = ["{{env.HOME}}/.local/libexec/keywrap"]
FIRECRAWL_KEY_FILE = "{{env.HOME}}/.config/secrets/claude/personal.env"
FIRECRAWL_KEY_VAR = "FIRECRAWL_API_KEY"
# 注意: CLAUDE_CODE_SUBPROCESS_ENV_SCRUB は設定しない。2026-08-31 に「=1 だと
# Claude Code が settings の permissions.defaultMode: auto を読む前に manual へ
# 黙って強制する」ことがバイナリ解析で判明し撤去した。サブプロセスからの
# 資格情報除去は sandbox.credentials.envVars（台帳全変数の deny）が主層として担う。

# タスク定義から共有するパス。run と usage（complete 含む）の両方で {{vars.x}} として展開される。
[vars]
dbx = "{{env.HOME}}/.config/dbx/bin/dbx"
skillsfile = "{{env.HOME}}/.config/agent-skills/Skillsfile"
textlint_home = "{{env.HOME}}/.config/textlint"
# brew doctor の Caskroom 破損チェック名。brew:cask:check と brew:cleanup の唯一の定義元。
# 名前は Homebrew が所有するので、改名されたらここだけ直す。
cask_check = "check_cask_corrupt_dirs"

[tools]
# ============================================================
# Node.js関連ツール
# ============================================================
# Node 26 は 2026-10-28 に LTS 入り予定 → LTS 入り後に "26" へ切り替える
node = "24"
bun = "latest"
pnpm = "latest"

# npm backend のインストーラとして自動採用される高速パッケージマネージャ（mise 作者 jdx 製）。
# lifecycle scripts（postinstall 等）を既定でブロックする。必要なツールは allow_builds で個別許可。
# @see https://github.com/jdx/aube
aube = "latest"

# @see https://github.com/github/copilot-cli
# 公式が npm 配布を提供しているため、他の npm 系 CLI と揃えて mise 管理にする。
# Homebrew cask だとバイナリ実体が Caskroom 内の symlink になり、copilot update での自己置換で
# ディレクトリ名と中身のバージョンがずれる。mise 管理ならこれが起きない。
"npm:@github/copilot" = "latest"

# @see https://geminicli.com/docs/get-started/installation/
"npm:@google/gemini-cli" = "latest"

# @see https://github.com/honojs/cli/blob/main/README.md#installation
"npm:@hono/cli" = "latest"

# @see https://github.com/mermaid-js/mermaid-cli
# 図の生成に使う（design docのスタック構成図など）。puppeteerのChromiumダウンロード
# （postinstall）はaubeがブロックするため、実行時は ~/.config/mermaid/puppeteer.json で
# システムのChromeを指す。ラッパータスクは conf.d/mermaid.toml の mise r mermaid。
# trust例外: cytoscape@3.34.1 はリードメンテナー本人の手動公開（GitHubリリース v3.34.1 と
# 公開者・日時が一致、tarballサイズも連続）を2026-08-20に検証済み。provenanceなしのため
# aubeのno-downgrade判定に掛かるが良性。次版がCI公開に戻れば例外は不要になる。
"npm:@mermaid-js/mermaid-cli" = { version = "latest", trust_policy_excludes = [
  "cytoscape@3.34.1",
] }

# @see https://github.com/vercel-labs/agent-browser
"npm:agent-browser" = "latest"

# @see https://github.com/firecrawl/cli
# AIエージェント向けのWeb検索・取得CLI。APIキーは環境変数に常在させず、
# ~/.local/libexec/keywrap/firecrawl が実行の瞬間に鍵ファイルから読んで実体へ exec する
# （プロファイル追従は各作業ツリーの FIRECRAWL_KEY_FILE / FIRECRAWL_KEY_VAR が担う）。
"npm:firecrawl-cli" = "latest"

# @see https://github.com/microsoft/playwright-cli
"npm:@playwright/cli" = "latest"

# @see https://github.com/vercel-labs/skills
"npm:skills" = "latest"

# @see https://github.com/typescript-language-server/typescript-language-server
# Claude Code の typescript-lsp プラグインが使用する Language Server
"npm:typescript-language-server" = "latest"

# ============================================================
# Python 関連ツール
# ============================================================
# diagram-design プラグインの /diagram-design:export-diagram が Python 版 playwright を
# 前提にしている（references/export.md の PNG export procedure）。素の macOS には python が
# 無く（python3 だけ）、Homebrew の python3 にも playwright は入らないため、ここで両方を揃える。
# postinstall は mise が管理する python の中で走るので、import playwright がそのまま通る。
# postinstall は新規マシンでの初期導入だけを担う。以後の更新と旧ブラウザの掃除は
# conf.d/playwright.toml の playwright:update（tools:update から呼ばれる）が行うため、
# 版を固定する必要はなく、複数版が溜まることもない。
# npm:@playwright/cli とは別物（あちらは Node 版で、ブラウザ実体も別管理）。
python = { version = "3.13", postinstall = "python -m pip install --upgrade playwright && python -m playwright install chromium" }

# ============================================================
# 汎用 CLI
# ============================================================
# @see https://github.com/jqlang/jq
# JSON の整形・抽出。back-office の admin-directory 系スクリプト、conf.d/skills.toml、
# tasks/mise/undeclared が使う。project 側の mise.toml には宣言しない（project だけの宣言は、
# その配下の外で解決できない shim が brew の実体を覆う。2026-09-04 の gh の障害と同型）。
# Homebrew との二重管理を避けるため brew の formula は 2026-09-05 に Brewfile から外した。
# secrets ヘルパーは SIP 保護下の /usr/bin/jq に固定しており、本項の変更に影響されない。
jq = "latest"

# ============================================================
# Go関連ツール
# ============================================================
go = "1"

# Cloudflare CLI

# ============================================================
# データベースツール
# ============================================================
# @see https://www.mongodb.com/docs/mongodb-shell/
mongosh = "latest"

# @see https://github.com/xo/usql
# 多DB対応の CLI SQL クライアント。dev/stg の Aurora MySQL を踏み台経由で参照するのに使う。
# -J の JSON 出力に加えて \dt / \d のメタコマンドまで JSON 化されるため、AI エージェントから叩きやすい。
# Homebrew の xo/xo tap は bottle が無く Go のソースビルドになるので mise（aqua backend）で入れる。
usql = "latest"

[tasks."mise:upgrade"]
description = "グローバルの [tools] と、呼び出した場所のプロジェクト設定に宣言したツールを更新する"
# wait_for: mise 本体が brew formula のため、brew:upgrade が /opt/homebrew/bin/mise を貼り替え終えてから実行する。
# 同時に走らせると unlink と link の間に mise が PATH から消える窓ができ、後続タスクが command not found になりうる。
# 合成タスクの brew:upgrade ではなく brew:upgrade:run を指すこと。合成側は brew:cask:check を depends に
# 持つため、そちらを指すと tools:updaters を経由した循環になる。
wait_for = ["brew:upgrade:run"]
# 1 行目はタスクの既定の作業ディレクトリ（本ファイルの config_root）で動くので、グローバル設定のツールだけが対象になる。
# 2 行目は呼び出した場所で --local を付けて動かし、プロジェクト設定に宣言したツールだけを更新する。
# プロジェクトがグローバルと同じツールを別の範囲で宣言していると（node の 24 と 26 など）、その場所ではプロジェクトの宣言が優先されるため、1 回の mise upgrade では両方を更新できない。
# 呼び出した場所にプロジェクト設定が無ければ 2 行目は何も更新しない。
run = [
    "mise upgrade",
    'mise -C "{{cwd}}" upgrade --local',
]

[tasks."mise:check"]
description = "グローバルの [tools] と、呼び出した場所のプロジェクト設定のうち、更新可能な mise ツールを表示する（変更は加えない）"
# 対象は mise:upgrade と揃える（1 行目がグローバル設定、2 行目が呼び出した場所のプロジェクト設定）。
run = [
    "mise outdated",
    'mise -C "{{cwd}}" outdated --local',
]

[tasks."mise:prune"]
description = "宣言済みツールのうち、追跡設定から参照されなくなった旧バージョンを削除する（宣言の無いツールは削除しない）"
# --yes 必須: 確認プロンプトは非対話実行で暗黙に「いいえ」となり、何も削除されない
# wait_for: tools:update では全更新タスク（tools:updaters）の完了後に、参照されなくなった版を削除する。
wait_for = ["mise:upgrade", "tools:updaters"]
# 引数なしの mise prune は宣言の無いツールも丸ごと削除し、mise:undeclared が人に残した判断を同じ実行の中で覆してしまう。
# そのため、追跡設定に宣言のあるツール名だけを引数に渡す。
# 引数を渡しても、存在しない設定を指す追跡リンクの掃除は続く。
# --tools を付けるとその掃除まで止まるので付けない。
# 宣言済みツールが 0 件なら中止する。
# 引数なしの呼び出しに戻ると、宣言の無いツールまで削除対象になるため。
run = '''
set -f
if ! declared="$(mise ls --json --all-sources)"; then
  echo "ERROR: mise ls --all-sources が失敗した。何も削除せずに中止する。" >&2
  exit 1
fi
if ! tools="$(printf '%s' "${declared}" | jq -r 'keys[]')"; then
  echo "ERROR: mise ls の出力を解析できなかった。何も削除せずに中止する。" >&2
  exit 1
fi
if [ -z "${tools}" ]; then
  echo "ERROR: 宣言済みツールが 0 件だった。引数なしの mise prune は宣言の無いツールも削除するので中止する。" >&2
  exit 1
fi
# ツール名は空白を含まないので、改行区切りの一覧を単語分割で引数に展開する（グロブ展開は set -f で止めてある）。
mise prune --yes ${tools}
'''

# 更新フェーズ（[2]〜[4]）の集約タスク。更新タスクを増やすときはここへ足すだけにする。
# 掃除タスク（mise:prune / brew:cleanup）はこれを wait_for に取ることで、tools:update 実行時に
# 全更新の完了後へ順序づけられる（単体実行や brew:update では存在しないので待ちは発生しない）。
[tasks."tools:updaters"]
description = "全更新タスクを集約する（tools:update 用）"
hide = true
depends = [
    "brew:upgrade:run",
    "mise:upgrade",
    "gcloud:upgrade",
    "textlint:update",
    "agent-skills:update",
    "gh-ext:upgrade",
    "playwright:update",
]

# wait_for により 5 フェーズで進む。各段の中だけが並列になるので、
# ターミナル上で「いま何をしているか」が読み取りやすい。
#   [1] mise:undeclared                                … 宣言が無いままインストールが残ったツールの検出（報告のみ。brew の貼り替え前に済ませる）
#   [2] brew:upgrade:run                               … Homebrew 本体と formula / cask の更新
#   [3] mise:upgrade + gh-ext:upgrade + gcloud:upgrade … [tools]（グローバルと呼び出した場所のプロジェクト）・gh 拡張・gcloud components の更新（brew の貼り替え完了後）
#   [4] textlint:update + agent-skills:update          … mise 管理のツールを使う更新
#   [5] mise:prune + brew:cask:check → brew:cleanup    … 掃除（mise 側は宣言済みツールだけ。Homebrew 側は Caskroom の破損検査を通ってから）
[tasks."tools:update"]
description = "brew・mise ツール（グローバルと呼び出した場所のプロジェクト）・agent skills・gh 拡張・textlint を更新後、参照されなくなった版とキャッシュを掃除する（mise は宣言済みツールだけ。5 フェーズ DAG）"
depends = [
    "tools:updaters",
    "mise:prune",
    "brew:cleanup",
    "mise:undeclared",
]
