# 秘密の台帳（公開側）。ここが env ファイル・headersHelper・unset リスト・deny リストの生成源になる。
# 取引先プロファイルの台帳は client-dotfiles の home/work/.chezmoidata/client-secrets-ledger.toml が
# clientSecretsLedger として同じ形で宣言し、テンプレートが両辞書を連結する。
#
# 設計の背景（2026-08-30 の API キー露出インシデント対応）:
# - 秘密は mise の [env]（全シェルへ輸出）に置かず、~/.config/secrets/claude/<プロファイル>.env
#   （0600・chezmoi 生成）に置く。値が要るプロセスだけが利用時に読む。
# - MCP は headersHelper（~/.config/secrets/claude/helpers/<プロファイル>-<サービス>.sh）が
#   接続の瞬間に env ファイルを読んでヘッダを返す。claude 本体の環境にも値を置かない。
# - .zshenv の unset リスト・Claude Code の permissions.deny / sandbox.credentials も
#   この台帳から生成する。変数の追加・削除はこのファイル（と client 側台帳）だけを編集する。
#
# <プロファイル>.<サービス> = 1 サービス。
# vars    env ファイルへ入る変数のリスト。name は変数名、op は 1Password 参照。
# header  MCP の HTTP ヘッダを生成するサービスだけが持つ。
#         name はヘッダ名、var は値に使う変数名、scheme は値の前置詞（"Bearer " か ""）。

[secretsLedger.personal.context7]
vars = [{ name = "CONTEXT7_API_KEY", op = "op://ykum4/Context7 API Key personal/credential" }]
header = { name = "CONTEXT7_API_KEY", var = "CONTEXT7_API_KEY", scheme = "" }

[secretsLedger.personal.firecrawl]
vars = [{ name = "FIRECRAWL_API_KEY", op = "op://ykum4/Firecrawl API Key personal/credential" }]
header = { name = "Authorization", var = "FIRECRAWL_API_KEY", scheme = "Bearer " }

[secretsLedger.hucom-system.context7]
vars = [{ name = "CONTEXT7_API_KEY_HUCOM_SYSTEM", op = "op://hucomsystem/Context7 API Key hucom-system/credential" }]
header = { name = "CONTEXT7_API_KEY", var = "CONTEXT7_API_KEY_HUCOM_SYSTEM", scheme = "" }

[secretsLedger.hucom-system.firecrawl]
vars = [{ name = "FIRECRAWL_API_KEY_HUCOM_SYSTEM", op = "op://hucomsystem/Firecrawl API Key hucom-system/credential" }]
header = { name = "Authorization", var = "FIRECRAWL_API_KEY_HUCOM_SYSTEM", scheme = "Bearer " }

[secretsLedger.hucom-system.google-dev-knowledge]
vars = [{ name = "GOOGLE_DEV_KNOWLEDGE_API_KEY_HUCOM_SYSTEM", op = "op://hucomsystem/Google Developer Knowledge API Key hucom-system/credential" }]
header = { name = "X-Goog-Api-Key", var = "GOOGLE_DEV_KNOWLEDGE_API_KEY_HUCOM_SYSTEM", scheme = "" }

# video:summarize タスクが YouTube 動画を映像込みで解析するときに読む（ヘッダ生成なし）。
[secretsLedger.hucom-system.gemini]
vars = [{ name = "GEMINI_API_KEY_HUCOM_SYSTEM", op = "op://hucomsystem/Gemini API Key hucom-system/credential" }]

# google-cloud-cli リモート MCP の事前登録 OAuth クライアント。claude:restore が登録時に読む。
# client_id は秘密ではないが、エージェントのシェルに置く理由も無いためまとめてここで扱う。
[secretsLedger.hucom-system.google-mcp-oauth]
vars = [
  { name = "GOOGLE_MCP_OAUTH_CLIENT_ID_HUCOM_SYSTEM", op = "op://hucomsystem/Google OAuth Client claude-mcp hucom-system/username" },
  { name = "GOOGLE_MCP_OAUTH_CLIENT_SECRET_HUCOM_SYSTEM", op = "op://hucomsystem/Google OAuth Client claude-mcp hucom-system/credential" },
]
